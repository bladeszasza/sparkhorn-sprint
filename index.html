<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Sparkhorn Sprint</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- HUD -->
<div id="hud">
  <div id="hud-left">
    <div id="title">SPARKHORN SPRINT</div>
  </div>
  <div id="hud-right">
    <div id="score-display">Csillagok: 0</div>
    <div id="lives-display">❤️❤️❤️</div>
    <div id="hiscore-display">Legjobb: 0</div>
  </div>
</div>
<div id="start-overlay">
  <div id="start-content">
    <div id="start-title">SPARKHORN SPRINT</div>
    <div id="start-instructions">Koppints egy unikornisra, hogy kiválaszd &bull; Koppints jobbra vagy balra a sávváltáshoz &bull; Koppints középre vagy húzd felfelé az ugráshoz</div>
    <div id="start-buttons">
      <button id="start-btn">JÁTÉK</button>
      <button id="start-say" title="Mondd el újra" aria-label="Mondd el újra">🔊</button>
    </div>
  </div>
  <div id="selected-unicorn-label"></div>
</div>
<div id="gameover-overlay" style="display:none;">
  <div id="gameover-text">Ügyes voltál!</div>
  <div id="final-score"></div>
  <div id="gameover-hint">Mindjárt választhatsz új unikornist…</div>
</div>
<div id="fade" style="display:none;"></div>

<!-- three.js r128 helyben (vendor/), így nem függ külső szolgáltatótól -->
<script src="vendor/three.min.js"></script>
<script src="textures_data.js"></script>
<script src="main.js"></script>
</body>
</html>
